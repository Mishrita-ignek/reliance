dependencies {
	compileOnly group: "biz.aQute.bnd", name: "biz.aQute.bndlib", version: "3.1.0"
	compileOnly group: "com.liferay", name: "com.liferay.osgi.util", version: "3.0.0"
	compileOnly group: "com.liferay", name: "com.liferay.portal.spring.extender", version: "2.0.0"
	compileOnly group: "com.liferay.portal", name: "com.liferay.portal.kernel", version: "2.6.0"
	compileOnly project(":modules:RelianceReality:RelianceReality-api")
	compile group: 'com.liferay', name: 'com.liferay.portal.dao.orm.custom.sql', version: '1.0.3'
	// https://mvnrepository.com/artifact/javax.mail/mail
	compile group: 'javax.mail', name: 'mail', version: '1.4'
	// https://mvnrepository.com/artifact/commons-httpclient/commons-httpclient
	compile group: 'commons-httpclient', name: 'commons-httpclient', version: '3.1'
	// https://mvnrepository.com/artifact/com.squareup.okhttp/okhttp
}

buildService {
	apiDir = "../RelianceReality-api/src/main/java"
}

group = "com.reliance.reality"